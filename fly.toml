# Fly.io deploy config.
#
# ONE environment. There is no separate dev/prod split: this is a personal
# project with a single operator, and a second environment would double the
# cost and the deploy ceremony for no one's benefit. Revisit if the app ever
# has users whose data a bad deploy could damage.
#
# Two process groups from one image:
#   web    — GraphQL + /health
#   worker — drains the Job table, then idle-exits so the machine stops
#
# Secrets (DATABASE_URL, AUTH_JWT_SECRET, RESEND_API_KEY, APP_SECRET) are pushed
# separately and never live in this file:
#   fly secrets import < .fly.secrets.env

app = 'cflfantasytools-api'
primary_region = 'yyz'
kill_timeout = '300s'

[build]
  dockerfile = 'Dockerfile'

# Direct node (no npm/tsx wrapper): Fly's SIGTERM must reach the app's own
# handler for a graceful drain — wrappers forward signals racily.
[processes]
  web = 'node --import tsx src/index.ts'
  worker = 'node --import tsx src/worker/index.ts'

[env]
  # The worker keeps its own schedule in-process and must stay up to do it.
  # A Fly machine schedule was the alternative, and on the other projects here
  # one silently stopped firing for five days — unacceptable for a capture job
  # whose whole purpose is not missing a week.
  WORKER_IDLE_EXIT_MS = '0'
  NODE_ENV = 'production'
  API_PORT = '4000'

[http_service]
  processes = ['web']
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = 'GET'
    path = '/health'
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'

# The worker no longer idle-exits (WORKER_IDLE_EXIT_MS=0), so restart it if it
# ever does stop — a stopped worker means capture has silently halted.
[[restart]]
  policy = 'always'
  processes = ['worker']

[[vm]]
  processes = ['web']
  size = 'shared-cpu-1x'
  memory = '512mb'

# 1GB, not 512mb: this machine launches Chromium for the club sites that need
# JS, and 512mb OOMs under Puppeteer.
[[vm]]
  processes = ['worker']
  size = 'shared-cpu-1x'
  memory = '1gb'
