# Fly.io deploy config.
#
# ONE environment. There is no separate dev/prod split: this is a personal
# project with a single operator, and a second environment would double the
# cost and the deploy ceremony for no one's benefit. Revisit if the app ever
# has users whose data a bad deploy could damage.
#
# Two process groups from one image:
#   web    — GraphQL + /health; scales to zero
#   worker — enqueues due scheduled jobs on boot, drains the Job table, then
#            idle-exits so the machine stops
#
# Secrets (DATABASE_URL, AUTH_JWT_SECRET, RESEND_API_KEY, APP_SECRET) are pushed
# separately and never live in this file:
#   fly secrets import < .fly.secrets.env

app = 'cflfantasytools-api'
primary_region = 'yyz'
kill_timeout = '300s'

[build]
  dockerfile = 'Dockerfile'

# Migrations run here, not from CI. Fly executes this in a temporary machine on
# the app image with the app's secrets, so DATABASE_URL is the internal .flycast
# URL and no proxy, no org-scoped token and no copy of the database password in
# GitHub are involved. A non-zero exit aborts the release before any machine
# takes the new version.
#
# KEEP MIGRATIONS ADDITIVE. This runs before the machines roll, so the outgoing
# release serves against the new schema for the length of the deploy.
[deploy]
  release_command = 'npx prisma migrate deploy'

# Direct node (no npm/tsx wrapper): Fly's SIGTERM must reach the app's own
# handler for a graceful drain — wrappers forward signals racily.
[processes]
  web = 'node --import tsx src/index.ts'
  worker = 'node --import tsx src/worker/index.ts'

[env]
  # OFF BY DEFAULT (since 2026-11-07). Production sits fully stopped — database,
  # worker and web — and data is collected on demand from a workstation by
  # scripts/collect.sh, which starts the database, lets the worker run every
  # due job, verifies them through jobHealth, and stops the database again.
  #
  # The ticker is off because web now starts on any request, and a stray hit on
  # a stopped stack would otherwise wake the worker against a database that is
  # down. Set this back to 'true' and min_machines_running to 1 below to return
  # to always-on, where web owns the schedule and wakes the worker itself.
  SCHEDULE_TICKER_ENABLED = 'false'
  # The worker enqueues due jobs once at boot and then only drains. Re-checking
  # the schedule mid-session (the always-on default) re-enqueued the 30-minute
  # depth-chart sweep forever, so a collection never finished. Remove to go
  # back to always-on.
  WORKER_SCHEDULE_RECHECK_MS = '0'
  NODE_ENV = 'production'
  API_PORT = '4000'

[http_service]
  processes = ['web']
  internal_port = 4000
  force_https = true
  # Scales to zero: started by the first request, stopped again when idle.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = 'GET'
    path = '/health'
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'

# The worker exits 0 once the queue is drained, so the machine stops and bills
# only for the minutes it worked. Only crashes restart it.
[[restart]]
  policy = 'on-failure'
  processes = ['worker']

[[vm]]
  processes = ['web']
  size = 'shared-cpu-1x'
  memory = '512mb'

# 1GB was for Chromium, which OOMed at 512mb. Browser scraping is gone, and
# 512mb looks enough: measured 2026-11-10 with the production image under a
# hard 512MB cgroup limit, on a corpus ~1.4x production's (475 games, 70k
# plays), a forced pbp-parse, epa-fit, projections-fit and a nine-club
# depth-chart sweep archiving and pdftotext-parsing 90 PDFs peaked at ~320MB
# RSS with the V8 heap under 100MB, and no OOM; it also completed under 384MB.
#
# Held at 1gb until after the 2026 Grey Cup collection, so the season's last
# collection is not the first live 512mb run; lower it in a one-line follow-up.
# The margin matters: at 512mb Node 22's heap limit is 259MB on top of ~240MB
# of non-heap, so under pressure the kernel OOM-kills the worker before V8 can
# fail cleanly. The job is left RUNNING, jobResetOrphaned requeues it with no
# attempt cap, and the worker crash-loops.
[[vm]]
  processes = ['worker']
  size = 'shared-cpu-1x'
  memory = '1gb'
