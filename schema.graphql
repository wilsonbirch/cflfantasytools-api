type Account {
  createdAt: DateTime!
  email: String!
  id: Int!
  role: Role!
  uuid: String!
}

type AuthPayload {
  accessToken: String!

  """Refresh before this; the access token is rejected after it."""
  accessTokenExpiresAt: DateTime!
  account: Account!

  """One-time use. Each refresh returns a new token and revokes this one."""
  refreshToken: String!
}

enum CoachingRole {
  DC
  HC
  OC
}

"""One person in one role at one club. Hand-maintained; not in any feed."""
type CoachingStaff {
  effectiveFrom: DateTime!

  """Null while current."""
  effectiveTo: DateTime
  id: Int!
  person: String!
  role: CoachingRole!
  team: Team!
}

input CoachingStaffInput {
  effectiveFrom: DateTime!
  effectiveTo: DateTime
  person: String!
  role: CoachingRole!
  teamSlug: String!
}

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

"""One posted depth chart; `url` is the club's own PDF."""
type DepthChart {
  """When the scraper first saw the chart."""
  detectedAt: DateTime!

  """Archived copies of the PDF, newest first; one per distinct checksum."""
  files: [DepthChartFile!]!
  id: Int!

  """Null until a parse has been attempted on an archived copy."""
  parseStatus: DepthChartParseStatus

  """
  Receiver alignment read from the newest archived copy. Empty unless parseStatus is OK.
  """
  positions: [DepthChartPosition!]!
  publishedAt: DateTime!
  season: String!
  title: String!
  url: String!
  uuid: String!
  week: Int!
  year: Int!
}

"""
An archived copy of a chart PDF. Bytes are served over REST, not GraphQL.
"""
type DepthChartFile {
  contentType: String!
  fetchedAt: DateTime!
  id: Int!
  sha256: String!

  """Bytes."""
  size: Int!

  """
  Absolute URL on this API that streams the file: GET /depth-charts/files/{id}.pdf
  """
  url: String!
}

"""A team's depth charts for one season, newest chart first."""
type DepthChartList {
  charts: [DepthChart!]!
  id: Int!
  team: Team!
  updatedAt: DateTime!
  uuid: String!
  year: Int!
}

"""
OK: positions were read. UNSUPPORTED: this club's layout has no parser yet. FAILED: the parser ran and could not read the file.
"""
enum DepthChartParseStatus {
  FAILED
  OK
  UNSUPPORTED
}

"""
One receiver slot on a chart. `position` counts OUTSIDE-IN: 1S is the widest receiver on the strong/field side, 2WK the second from the outside on the weak/boundary side.
"""
type DepthChartPosition {
  """1 = starter, 2 = second string, 3 = third."""
  depth: Int!

  """Jersey number when the chart prints one."""
  jersey: Int

  """Name as printed on the chart."""
  player: String!

  """1S, 2S, 3S, 1WK, 2WK, ..."""
  position: String!
}

type Drive {
  id: Int!
  isScoring: Boolean!
  number: Int!

  """Signed for the possessing team: negative means the opponent scored."""
  points: Int
  startQuarter: Int
  team: Team!
}

enum EmailStatus {
  BOUNCED
  COMPLAINED
  DELIVERED
  FAILED
  QUEUED
  SENT
}

"""
A Game Zone fantasy player with the salary, projection and points the feed carries, plus our own projection for one gameweek.
"""
type FantasyPlayer {
  """Game Zone's average points per game played, as of the latest sync."""
  avgPoints: Float
  firstName: String!

  """Game Zone's own id for the player."""
  gameZoneId: Int!

  """
  Game Zone's own projection for the upcoming gameweek, as of the latest sync.
  """
  gameZoneProjection: Float
  id: Int!

  """Game Zone's injury note; null when there is none."""
  injuredText: String

  """
  False once the player has been absent from several consecutive feed pulls.
  """
  isActive: Boolean!
  isLocked: Boolean!

  """
  Points in the most recent completed gameweek; null when the player did not feature.
  """
  lastGameweekPoints: Float
  lastName: String!

  """First and last name."""
  name: String!

  """Every gameweek the player scored in, oldest first."""
  pointsHistory: [GameweekPoints!]!
  position: PlayerPosition!

  """
  Our projection for the gameweek the query asked for; null when none has been fitted.
  """
  projection: Projection

  """Game Zone salary as of the latest sync."""
  salary: Int

  """
  One point per change in salary, oldest first, ending at the current value.
  """
  salaryHistory: [SalarySnapshot!]!

  """Game Zone season total as of the latest sync."""
  seasonPoints: Float

  """Game Zone's availability status as the feed reports it."""
  status: String
  team: Team

  """projection.points per $1000 of salary; null without both."""
  value: Float

  """Salary change this week, as the feed reports it."""
  weekSalaryChange: Int
}

"""One fixture. Scores and stats are derived from plays at read time."""
type Game {
  awayScore: Int
  awayTeam: Team
  boxScore: [TeamBoxScore!]!
  date: DateTime
  drives: [Drive!]!
  homeScore: Int
  homeTeam: Team
  id: Int!
  playerStats: [PlayerGameStats!]!

  """Chronological, including no-plays."""
  plays: [Play!]!
  ruleEra: RuleEra
  year: Int!
}

"""One Game Zone fantasy round and its fixtures."""
type Gameweek {
  endDate: DateTime
  gameZoneId: Int!
  id: Int!
  matches: [Match!]!
  name: String!
  startDate: DateTime

  """scheduled, playing or complete, as the feed reports it."""
  status: String!

  """1-based ordinal of the gameweek within its season, by start date."""
  week: Int!
  year: Int!
}

"""Fantasy points one player scored in one gameweek."""
type GameweekPoints {
  gameweek: Gameweek!
  points: Float!
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

type Job {
  attempts: Int!
  createdAt: DateTime!
  error: String
  finishedAt: DateTime
  id: Int!
  kind: String!
  payload: JSON!
  runAt: DateTime!
  startedAt: DateTime
  status: JobStatus!
}

"""Freshness of one scheduled background job."""
type JobHealth {
  ageMinutes: Int
  expectedEveryMinutes: Int!
  isStale: Boolean!
  kind: String!
  lastSuccessAt: DateTime
}

enum JobStatus {
  FAILED
  PENDING
  RUNNING
  SUCCEEDED
}

"""One fixture as Game Zone schedules it."""
type Match {
  awayScore: Int
  awayTeam: Team
  date: DateTime

  """The parsed play-by-play for this fixture; null until captured."""
  game: Game
  gameZoneId: Int!
  gameweek: Gameweek!
  homeScore: Int
  homeTeam: Team
  id: Int!
  status: String!
  venue: String
}

type Mutation {
  """Admin only. Idempotent: deleting a missing row returns false."""
  deleteCoachingStaff(id: Int!): Boolean!

  """Admin only. Unknown kinds are rejected with BAD_USER_INPUT."""
  enqueueJob(kind: String!, payload: JSON): Job!

  """Wrong email and wrong password fail identically."""
  login(email: String!, password: String!): AuthPayload!

  """Revokes the session the refresh token belongs to. Idempotent."""
  logout(refreshToken: String!): Boolean!

  """Rotates the token; reusing a rotated token revokes the whole session."""
  refresh(refreshToken: String!): AuthPayload!

  """Password must be at least 8 characters."""
  register(email: String!, password: String!): AuthPayload!

  """Signed in only."""
  subscribe(teamSlug: String!): NotificationSubscription!

  """Signed in only."""
  unsubscribe(teamSlug: String!): NotificationSubscription!

  """Signed link from a notification email; needs no session."""
  unsubscribeWithToken(token: String!): Boolean!

  """Admin only."""
  updateTeamSource(id: Int!, input: TeamSourceInput!): TeamSource!

  """
  Admin only. Upserts on (team, role, person, effectiveFrom); co-coordinators are two rows.
  """
  upsertCoachingStaff(input: CoachingStaffInput!): CoachingStaff!
}

type NotificationSubscription {
  createdAt: DateTime!
  enabled: Boolean!
  id: Int!
  team: Team!
  updatedAt: DateTime!
}

enum PassDepth {
  DEEP
  SHORT
}

enum PassDirection {
  LEFT
  MIDDLE
  RIGHT
}

type Play {
  airYards: Int
  clock: String!
  description: String!
  distance: String
  down: Int
  driveNumber: Int!
  epa: Float
  id: Int!

  """Whether a pass was caught; null on non-pass plays."""
  isComplete: Boolean
  isFirstDown: Boolean!

  """A penalty wiped this snap; excluded from all stats."""
  isNoPlay: Boolean!
  isScoring: Boolean!
  isTurnover: Boolean!
  number: Int!
  passer: String
  phase: String!

  """Points on this play, signed for its team; -6 is a return touchdown."""
  points: Int

  """1-4; null in overtime or when the feed gives no quarter."""
  quarter: Int
  receiver: String
  rusher: String
  subtype: String
  targetDepth: PassDepth
  targetDirection: PassDirection
  team: Team!
  type: String!
  yardLine: Int
  yardsAfterCatch: Int
  yardsGained: Int
}

"""Per-player production in one game, from plays (no-plays excluded)."""
type PlayerGameStats {
  """
  Receiver position (1S, 2WK, ...) on the team's chart for that game's week; null when no parsed chart names the player.
  """
  alignment: String
  completions: Int!
  epa: Float!
  gameId: Int!
  interceptions: Int!
  passAttempts: Int!
  passingTouchdowns: Int!
  passingYards: Int!

  """Name as it appears in the play text, e.g. "#12 A.Smith"."""
  player: String!
  receivingTouchdowns: Int!
  receivingYards: Int!
  receptions: Int!
  rushAttempts: Int!
  rushingTouchdowns: Int!
  rushingYards: Int!
  targets: Int!
  targetsByZone: [ZoneTargets!]!
  team: Team!
}

enum PlayerPosition {
  OTHER
  QUARTERBACK
  RUNNING_BACK
  WIDE_RECEIVER
}

"""Per-player production over a season, from plays (no-plays excluded)."""
type PlayerSeasonStats {
  completions: Int!
  epa: Float!
  games: Int!
  interceptions: Int!
  passAttempts: Int!
  passingTouchdowns: Int!
  passingYards: Int!

  """Name as it appears in the play text, e.g. "#12 A.Smith"."""
  player: String!

  """
  Most common receiver position across the season's parsed charts; null when no parsed chart names the player.
  """
  primaryAlignment: String
  receivingTouchdowns: Int!
  receivingYards: Int!
  receptions: Int!
  rushAttempts: Int!
  rushingTouchdowns: Int!
  rushingYards: Int!
  targets: Int!
  targetsByZone: [ZoneTargets!]!
  team: Team!
  year: Int!
}

"""
Projected production for one player in one gameweek: role baseline + player quality (shrunk toward the league mean by sample size) + offensive-coordinator offset + opposing defensive-coordinator offset, fitted on the current rule era only. Every number is a per-game expectation.
"""
type Projection {
  """
  Receiver position (1S, 2WK, ...) the role baseline was taken from; null when no chart names the player.
  """
  alignment: String

  """
  Expected EPA of the plays the player throws, carries or is targeted on.
  """
  epa: Float!
  fittedAt: DateTime!

  """
  Games behind the player term; the fewer, the more the projection is pooled.
  """
  games: Int!
  gameweek: Gameweek!
  id: Int!
  interceptions: Float!

  """The opposing team; null when the fixture is not known."""
  opponent: Team
  passAttempts: Float!
  passingTouchdowns: Float!
  passingYards: Float!
  player: FantasyPlayer!

  """
  Fantasy points under the current Game Zone scoring, computed at read time from the stat projections.
  """
  points: Float!
  receivingTouchdowns: Float!
  receivingYards: Float!
  receptions: Float!
  rushAttempts: Float!
  rushingTouchdowns: Float!
  rushingYards: Float!
  targets: Float!
}

type Query {
  """
  Staff in post at any point during the season, every club unless teamSlug is given; by team, role, effectiveFrom.
  """
  coachingStaff(teamSlug: String, year: Int!): [CoachingStaff!]!
  depthChartLists(teamSlug: String!, year: Int): [DepthChartList!]!
  depthChartYears(teamSlug: String!): [Int!]!

  """
  One player, with our projection for gameweekId (the current gameweek when omitted).
  """
  fantasyPlayer(gameweekId: Int, id: Int!): FantasyPlayer

  """
  Active players by salary, highest first. gameweekId selects which projection is attached; omitted means the current gameweek (the first not yet complete).
  """
  fantasyPlayers(gameweekId: Int, limit: Int = 100, offset: Int = 0, position: PlayerPosition, teamSlug: String): [FantasyPlayer!]!
  game(id: Int!): Game

  """Newest first. Only games with parsed plays."""
  games(limit: Int = 50, offset: Int = 0, teamSlug: String, year: Int!): [Game!]!
  gameweek(id: Int!): Gameweek

  """A season's gameweeks by start date."""
  gameweeks(year: Int!): [Gameweek!]!
  isUp: Boolean!

  """Whether each scheduled job has run recently enough."""
  jobHealth: [JobHealth!]!

  """Admin only. Newest first."""
  jobs(kind: String, limit: Int = 50, status: JobStatus): [Job!]!

  """Null when signed out."""
  me: Account

  """Signed in only."""
  mySubscriptions: [NotificationSubscription!]!

  """Sorted by targets + pass attempts + rush attempts, descending."""
  playerSeasonStats(limit: Int = 100, offset: Int = 0, teamSlug: String, year: Int!): [PlayerSeasonStats!]!

  """
  The latest fitted projections for one gameweek (week is Gameweek.week), highest points first.
  """
  projections(teamSlug: String, week: Int!, year: Int!): [Projection!]!

  """Admin only. Newest first."""
  scrapeRuns(limit: Int = 50, teamSlug: String): [ScrapeRun!]!

  """Every year with a game or a fixture, newest first."""
  seasons: [Int!]!
  team(slug: String!): Team

  """
  The newest parsed chart for the team's week (or the season's newest when week is omitted); null when none has parsed OK.
  """
  teamAlignment(teamSlug: String!, week: Int, year: Int!): TeamAlignment

  """Admin only."""
  teamSources: [TeamSource!]!
  teams: [Team!]!
}

enum Role {
  ADMIN
  USER
}

enum RuleEra {
  E2026
  E2027
  PRE_2026
}

"""A player's salary as of one sync."""
type SalarySnapshot {
  capturedAt: DateTime!
  gameZoneProjection: Float
  salary: Int!
  weekSalaryChange: Int
}

type ScrapeRun {
  addedCount: Int
  error: String
  finishedAt: DateTime
  id: Int!
  itemCount: Int

  """Charts whose PDF changed under an unchanged link this run."""
  revisedCount: Int
  startedAt: DateTime!
  status: ScrapeStatus!
  team: Team!
}

enum ScrapeStatus {
  FAILED
  OK
  REJECTED
}

type Team {
  abbreviation: String!
  city: String

  """
  Staff in post at any point during the season; every row when year is omitted.
  """
  coachingStaff(year: Int): [CoachingStaff!]!
  id: Int!
  isActive: Boolean!
  name: String!
  nameFr: String
  shortName: String
  slug: String!
  uuid: String!
}

"""A team's receiver alignment as of one chart."""
type TeamAlignment {
  chart: DepthChart!
  positions: [DepthChartPosition!]!
  team: Team!
  week: Int!

  """Every week of the season with a chart that parsed OK, ascending."""
  weeks: [Int!]!
  year: Int!
}

"""One team's totals in a game, from plays (no-plays excluded)."""
type TeamBoxScore {
  completions: Int!
  epa: Float!
  firstDowns: Int!
  passAttempts: Int!
  passingYards: Int!
  plays: Int!
  points: Int!
  rushAttempts: Int!
  rushingYards: Int!
  team: Team!
  totalYards: Int!
  turnovers: Int!
}

type TeamSource {
  config: JSON!
  enabled: Boolean!
  id: Int!
  kind: String!
  lastError: String
  lastItemCount: Int
  lastOkAt: DateTime
  requiresBrowser: Boolean!
  strategy: String!
  team: Team!
  updatedAt: DateTime!
  url: String!
}

"""Every field optional; omitted fields are left unchanged."""
input TeamSourceInput {
  config: JSON
  enabled: Boolean
  requiresBrowser: Boolean
  strategy: String
  url: String
}

"""Targets to one (depth, direction) zone."""
type ZoneTargets {
  depth: PassDepth!
  direction: PassDirection!
  epa: Float!
  receptions: Int!
  targets: Int!
  yards: Int!
}
