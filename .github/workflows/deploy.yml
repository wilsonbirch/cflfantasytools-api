# Deploy to production on every merge to main.
#
# No test jobs here on purpose. `main` is protected with the five CI contexts
# required and `strict` on, so a commit can only land after that exact tree went
# green on its PR — re-running the suite would be byte-identical duplication.
# If those required checks are ever removed, this workflow becomes unguarded and
# the suite has to move back in.
#
# Migrations are NOT run here. fly.toml's [deploy] release_command applies them
# inside Fly, on the app image, with the app's own secrets — so this workflow
# needs no database password and no tunnel, and a failed migration aborts the
# release before any machine takes the new version.
name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

# Never let two deploys overlap, and never cancel one mid-roll — a half-applied
# release is worse than a queued one.
concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            # Pinned to a SHA, not @master. This job holds a token that can
            # deploy production, the repo is public, and a mutable ref means a
            # compromise of that action runs attacker code with the token.
            # Bump deliberately: superfly/flyctl-actions master @ 2026-04-08.
            - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

            - name: Deploy
              env:
                  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
              run: flyctl deploy --remote-only

            # Cheap proof the release is actually serving, not just that Fly
            # accepted it. /health is unauthenticated by design.
            - name: Verify
              run: |
                  for i in $(seq 1 20); do
                      code=$(curl -sS -o /dev/null -w '%{http_code}' \
                          https://cflfantasytools-api.fly.dev/health || true)
                      [ "$code" = "200" ] && { echo "health OK"; exit 0; }
                      sleep 5
                  done
                  echo "::error::/health did not return 200 after the deploy"
                  exit 1
